<script>const rocasShareSavedQuoteOriginal=window.rocasShareSavedQuote;window.rocasShareSavedQuote=async function(q,item,button){await rocasShareSavedQuoteOriginal(q,item,button);const box=item.querySelector('.share-result'),link=box?.querySelector('a.linkbox');if(!link||box.querySelector('.share-primary'))return;const b=document.createElement('button');b.type='button';b.className='share-primary';b.textContent='Compartir con cliente';b.style.cssText='padding:10px 14px;background:#1d6655;color:#fff;font-weight:800;margin:9px 8px 9px 0';b.onclick=async()=>{const status=box.querySelector('div');if(typeof navigator.share!=='function'){status.textContent='Tu navegador no ofrece compartir desde aquí. Usa “Copiar enlace”; no se ha enviado nada.';return}status.textContent='Elige WhatsApp, Telegram o Gmail si aparecen. Luego elige destinatario y confirma el envío en esa aplicación.';try{await navigator.share({title:'Cotización ROCAS '+q.number,text:'Hola '+q.form.client+', te comparto la cotización '+q.number+' para '+q.form.project+'.',url:link.href});status.textContent='Se cerró la hoja de compartir. Confirma en la aplicación elegida si el mensaje se envió.'}catch(e){status.textContent=e?.name==='AbortError'?'No se compartió el enlace. Puedes intentarlo de nuevo o usar “Copiar enlace”.':'No se pudo abrir la hoja de compartir. Usa “Copiar enlace” como alternativa.'}};box.insertBefore(b,link)};</script>
